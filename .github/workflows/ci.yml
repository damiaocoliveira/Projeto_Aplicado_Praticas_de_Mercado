name: CI / Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-tests:
    name: Build, SAST & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: 🐍 Configurar Ambiente Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🔍 Análise Estática de Segurança - SAST (Bandit)
        run: |
          bandit -r app/ -ll --exclude .venv,tests

      - name: 🧹 Linting e Qualidade de Código (Flake8)
        run: |
          flake8 app/ tests/ --count --max-line-length=120 --statistics

      - name: 🧪 Execução de Testes Automatizados (Pytest)
        run: |
          pytest -v tests/
